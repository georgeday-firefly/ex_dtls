name: Lint and test

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})
    strategy:
      matrix:
        otp: ['29']
        elixir: ['1.20']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix credo
      - run: mix dialyzer
      - run: mix format --check-formatted
      - run: mix docs 2>&1 | (! grep -q "warning:")

  test:
    runs-on: ubuntu-latest
    name: Test (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})
    strategy:
      matrix:
        otp: ['29']
        elixir: ['1.20']
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix coveralls.json
      - uses: codecov/codecov-action@v3

  native:
    runs-on: ubuntu-latest
    name: Native failure and concurrency checks
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config
      - name: Check memory safety, failure cleanup, and queue boundaries
        run: bash test/native/run.sh
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      - name: Check concurrent initialization for data races
        run: bash test/native/run.sh
        env:
          CC: clang
          CFLAGS: -fsanitize=thread -fno-sanitize-recover=all -fno-omit-frame-pointer
