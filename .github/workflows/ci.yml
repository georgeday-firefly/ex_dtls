name: Lint and test

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})
    strategy:
      matrix:
        otp: ['29']
        elixir: ['1.20']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix credo
      - run: mix dialyzer
      - run: mix format --check-formatted
      - run: mix docs 2>&1 | (! grep -q "warning:")

  test:
    runs-on: ubuntu-latest
    name: Test (OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}})
    strategy:
      matrix:
        otp: ['29']
        elixir: ['1.20']
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - name: Check fragment queue boundaries
        run: |
          cc -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/native/bio_frag_test.c c_src/ex_dtls/bio_frag.c \
            $(pkg-config --cflags --libs openssl) -o /tmp/bio-frag-test
          /tmp/bio-frag-test
      - run: mix coveralls.json
      - uses: codecov/codecov-action@v3
